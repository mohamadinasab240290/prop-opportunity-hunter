name: Telegram HARD TEST
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Show debug info
        run: |
          echo "TOKEN EXISTS: ${{ secrets.BOT_TOKEN != '' }}"
          echo "CHAT EXISTS: ${{ secrets.CHAT_ID != '' }}"
      - name: Send message
        run: |
          curl -v "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.CHAT_ID }}" \
          -d "text=TEST FROM GITHUB FINAL"