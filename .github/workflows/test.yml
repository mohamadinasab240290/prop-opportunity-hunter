name: Telegram Test
on:
  workflow_dispatch:
jobs:
  send-message:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram message
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.CHAT_ID }}" \
          -d "text=🚀 Prop Opportunity Hunter is connected!"